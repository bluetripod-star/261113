<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1230">
<title>서울역 데이트 코스</title>
<style>
:root{
  --ink:#eef1ff;--sub:#a8b2da;--line:rgba(255,255,255,.14);
  --glass:rgba(16,24,58,.72);--glass2:rgba(255,255,255,.06);
  --amber:#ffcf70;--amber-ink:#2a1c00;--rose:#ff9aa8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Pretendard",sans-serif;line-height:1.6;
  background:#0b1331;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 90% 40% at 50% 100%,rgba(255,170,110,.20),transparent 70%),
    linear-gradient(180deg,#050919 0%,#0b1331 42%,#17205a 78%,#28286b 100%)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
.moon{position:absolute;top:7vh;right:12vw;width:44px;height:44px;border-radius:50%;
  background:#fff6dc;box-shadow:0 0 28px 8px rgba(255,238,190,.35)}
#city{position:absolute;left:0;bottom:0;width:100%;height:38vh;min-height:180px}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:28px 20px 64px}
.eyebrow{margin:0;color:var(--amber);font-size:14px;font-weight:600;letter-spacing:.02em}
h1{margin:4px 0 0;font-size:26px;line-height:1.3}
.nav{display:flex;align-items:center;gap:12px;margin:28px 0 8px;min-height:36px}
.back{background:none;border:0;color:var(--sub);font:inherit;font-size:14px;padding:6px 4px;cursor:pointer;visibility:hidden}
.back.on{visibility:visible}
.bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--rose));border-radius:2px;transition:width .35s ease}
.step{font-size:13px;color:var(--sub);min-width:34px;text-align:right}
#stage{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.q{margin:28px 0 6px;font-size:24px;line-height:1.4;outline:none}
.hint{margin:0 0 22px;color:var(--sub);font-size:14px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{
  text-align:left;width:100%;font:inherit;color:var(--ink);cursor:pointer;
  background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:border-color .15s,background .15s,transform .15s;
}
.opt:hover{border-color:var(--amber)}
.opt:active{transform:scale(.99)}
.opt:focus-visible,.back:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.opt.sel{border-color:var(--amber);background:rgba(255,207,112,.16)}
.opt b{display:block;font-size:17px;font-weight:700}
.opt small{display:block;margin-top:2px;color:var(--sub);font-size:13px}

/* result */
.rtitle{margin:28px 0 14px;font-size:24px;line-height:1.4}
.warn{background:rgba(255,207,112,.14);border:1px solid rgba(255,207,112,.4);color:#ffe2a6;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:10px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:6px 18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.tl li:last-child{border-bottom:0}
.t{flex:0 0 96px;font-weight:700;font-size:13px;color:var(--amber);padding-top:2px}
.b strong{display:block;font-size:16px}
.b span{display:block;margin-top:2px;font-size:13px;color:var(--sub)}
.tl li.fixed{margin:0 -18px;padding:16px 18px;background:linear-gradient(90deg,rgba(255,154,168,.20),rgba(255,207,112,.14));border-bottom:0}
.tl li.fixed .t{color:var(--rose)}
.tl li.fixed .b span{color:#d9def5}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;font:inherit;font-size:15px;border-radius:12px;padding:13px 14px;cursor:pointer;border:1px solid var(--line);background:var(--glass);color:var(--ink)}
.btn.main{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
footer{margin-top:22px;color:var(--sub);font-size:12px}
#intro{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#intro p{margin:0;font-size:30px;font-weight:700;line-height:1.6;opacity:0;animation:hello 3.4s ease both}
#intro p span{display:block}
#intro p span+span{font-size:22px;font-weight:500;color:var(--amber);margin-top:6px}
@keyframes hello{0%{opacity:0;transform:translateY(8px)}28%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
main{transition:opacity .7s ease}
body.intro main{opacity:0;visibility:hidden}
@media (prefers-reduced-motion:reduce){#stage,.star{animation:none}.bar i{transition:none}#intro p{animation-duration:2s}}
@media (max-width:420px){.t{flex-basis:84px}.q,.rtitle{font-size:22px}}
</style>
</head>
<body class="intro">
<div id="sky" aria-hidden="true"><div class="moon"></div></div>
<div id="intro" role="status"><p><span>안녕!</span><span>우리 토요일에 뭐할까요?</span></p></div>
<main>
  <header>
    <p class="eyebrow" id="dateLabel"></p>
    <h1>서울역 데이트 코스</h1>
  </header>
  <div class="nav">
    <button type="button" class="back" id="back">이전</button>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <span class="step" id="stepLabel"></span>
  </div>
  <section id="stage" aria-live="polite"></section>
  <footer>운영시간과 행사 일정은 바뀔 수 있어요. 출발 전에 각 장소의 최신 정보를 확인해 주세요.</footer>
</main>

<script>
const DATE='2026-11-14';
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}

/* ---------- 질문 ---------- */
const Q={
 cable:{q:'아침에 남산 케이블카 탈래요?',hint:'10시쯤 명동역에서 만나 올라가는 코스예요.',o:[
  ['yes','좋아요','남산 정상에서 산책하고 전망을 봐요'],
  ['no','오늘은 다른 게 좋아요','골목이나 시장 쪽으로 가요']]},
 shop:{q:'그럼 골목 구경이나 쇼핑을 해볼까요?',hint:'구경하다가 마음에 드는 걸 사 오는 느낌이에요.',o:[
  ['alley','골목 구경이 좋아요','후암동·해방촌 적산가옥 카페, 독립서점, 로컬숍'],
  ['seoul','시장과 전시도 좋아요','문화역서울284, 서울로7017, 남대문시장']]},
 walk:{q:'오늘은 걷는 게 좋아요?',hint:'걷는 양에 맞춰 이동 수단을 정해 드려요.',o:[
  ['high','많이 걸어도 좋아요','도보 위주로 다녀요'],
  ['mid','적당히요','필요하면 택시를 타요'],
  ['low','가능하면 택시요','택시 위주로 다녀요']]},
 lunch:{q:'늦은 점심은 뭐가 당겨요?',hint:'해방촌에서 먹는 걸로 골라 놨어요.',o:[
  ['pizza','피자요','ESP, 사워도우 피자에 딥 스테이션이 같이 나와요'],
  ['mersin','케밥으로 가볍게요','메르신 케밥, 신흥로 84 1층'],
  ['ssoul','와인이랑 같이요','서울앤쏘울, 신흥로 97-5 1층 와인바']]},
 night:{q:'집냥이 하고 나와서는 어떻게 할까요?',hint:'20시 이후 일정이에요.',o:[
  ['seoulro','야경 보며 살짝 걸어요','서울로7017, 집냥이 하는 곳에서 가까워요'],
  ['namsan','남산 야경도 보고 싶어요','명동역에서 케이블카'],
  ['wine','와인 한 잔 더요','서울앤쏘울 2차, 24시까지 영업'],
  ['home','바로 집에 갈래요','']]}
};
let A={},idx=0,done=false,timer=null;
const order=()=>A.cable==='no'?['cable','shop','walk','lunch','night']:['cable','walk','lunch','night'];

/* ---------- 화면 ---------- */
function show(){
  const o=order(),stage=$('#stage');
  stage.innerHTML='';stage.style.animation='none';void stage.offsetWidth;stage.style.animation='';
  $('#back').classList.toggle('on',idx>0||done);
  if(done){
    $('#fill').style.width='100%';$('#stepLabel').textContent='';
    renderResult(stage,build());return;
  }
  const key=o[idx],d=Q[key];
  const total=A.cable===undefined?5:o.length;
  $('#fill').style.width=((idx)/total*100)+'%';
  $('#stepLabel').textContent=(idx+1)+' / '+total;
  const h=el('h2','q',d.q);h.tabIndex=-1;stage.appendChild(h);
  if(d.hint)stage.appendChild(el('p','hint',d.hint));
  const w=el('div','opts');
  d.o.forEach(x=>{
    const b=el('button','opt'+(A[key]===x[0]?' sel':''));b.type='button';
    b.appendChild(el('b','',x[1]));if(x[2])b.appendChild(el('small','',x[2]));
    b.onclick=()=>choose(key,x[0],b);
    w.appendChild(b);
  });
  stage.appendChild(w);
  if(window.scrollY>0)window.scrollTo({top:0});
  h.focus({preventScroll:true});
}
function choose(key,val,btn){
  if(timer)return;
  A[key]=val;
  if(key==='cable'&&val==='yes')delete A.shop;
  btn.classList.add('sel');
  timer=setTimeout(()=>{
    timer=null;
    const o=order();
    if(idx<o.length-1)idx++;else done=true;
    show();
  },200);
}
$('#back').onclick=()=>{
  if(timer)return;
  if(done){done=false;idx=order().length-1}
  else if(idx>0)idx--;
  show();
};

/* ---------- 코스 만들기 ---------- */
function build(){
  const dow=new Date(DATE+'T00:00:00').getDay();
  const day='일월화수목금토'[dow];
  const weekend=dow===0||dow===6;
  const festival=DATE>='2026-11-12'&&DATE<='2026-11-15';
  const walk=A.walk;
  const morning=A.cable==='yes'?'namsan':A.shop;
  let lunch=A.lunch,night=A.night;
  const warns=[],it=[];
  const push=(t,title,d,fixed)=>it.push({t:t,title:title,d:d||'',fixed:!!fixed});

  if(lunch==='ssoul'&&!weekend){
    warns.push(day+'요일에는 서울앤쏘울이 '+(dow===1?'정기휴무예요.':'16시에 열어서 점심이 어려워요.')+' 점심은 메르신 케밥으로 바꿨어요.'+(dow===1?'':' 서울앤쏘울은 20시 이후 2차로 넣어 보세요.'));
    lunch='mersin';
  }
  if(night==='wine'&&dow===1){
    warns.push('월요일은 서울앤쏘울이 쉬는 날이라 20시 이후 일정을 서울로7017 산책으로 바꿨어요.');
    night='seoulro';
  }

  if(morning==='namsan'){
    push('10:00','명동에서 만나요','4호선, 서울역에서 2정거장이에요. 케이블카 승강장이 명동역 인근에 있어요.');
    push('10:15~12:00','케이블카로 남산 정상','약 3분이면 올라가요. 10시 운행 시작에 맞추세요.'+(weekend?' 주말은 대기가 길 수 있어요.':'')+' N서울타워 주변을 산책하고 전망을 봐요.');
    push('12:00~13:00','해방촌으로 이동',walk==='low'?'택시로 이동해요. 약 10~15분이에요.':'소월길로 걸어 내려와요. 내리막이고 약 30~40분이에요. 추우면 택시를 타세요.');
  }else if(morning==='alley'){
    push('10:30','숙대입구역에서 만나요','4호선, 서울역 다음 역이에요.');
    push('10:45~12:30','후암동 골목 구경',walk==='low'?'킷테(적산가옥 카페)와 독립서점 스토리지북앤필름 위주로 짧게 돌아요.':'킷테(적산가옥 카페), 지월장, 독립서점 스토리지북앤필름, 후암동 108계단을 걸어요. 갤러리는 전시마다 운영시간이 달라 확인이 필요해요.');
    push('12:30~13:00','해방촌 방향으로 이동',walk==='high'?'신흥시장 쪽으로 걸어 올라가요. 오르막이 있어요.':'택시로 이동해요. 약 5~10분이에요.');
  }else{
    push('10:00','서울역에서 만나요');
    push('10:10~11:00','문화역서울284',festival?'오늘전통축제(11/12~15) 기간이에요. 팝업스토어와 전시를 볼 수 있어요. 운영시간은 확인해 주세요.':'전시가 없는 날은 휴관일 수 있어요. 방문 전 일정을 확인해 주세요.');
    push('11:00~11:40','서울역 옥상정원과 서울로7017',walk==='low'?'옥상정원 위주로 가볍게 봐요.':'옥상정원에서 서울로7017로 이어서 걸어요.');
    push('11:40~12:30','남대문시장 구경','시장은 오전에 보는 게 좋아요.'+(walk==='low'?' 입구 쪽만 가볍게 봐요.':''));
    push('12:30~13:00','해방촌으로 이동','택시나 버스로 약 15분이에요.');
  }

  let cafeStart='14:15';
  if(lunch==='ssoul'){
    push('13:00~14:15','점심: 서울앤쏘울','신흥로 97-5 1층 와인바예요. 토·일은 13시에 열어요. 전화나 인스타그램 DM으로 예약해 두세요.');
  }else if(lunch==='mersin'){
    push('13:00~13:30','해방촌 오거리 주변 구경','웨이팅을 피하려고 점심은 13:30 이후로 잡았어요.');
    push('13:30~14:30','점심: 메르신 케밥','신흥로 84 1층이에요. 가게가 아담해서 웨이팅이 있을 수 있어요.');
    cafeStart='14:30';
  }else{
    push('13:00~14:15','점심: ESP (Earth Social Pizza)','신흥로20길 16 1층, 해방촌 오거리 바깥쪽이에요. 사워도우 피자에 올리브오일·페스토·사워크림 딥 스테이션이 같이 나와요. 웨이팅이 생기는 곳이라 예약과 영업시간을 미리 확인해 주세요. 자리가 없으면 미드나잇포레스트(화덕피자)가 대안이에요.');
  }

  push(cafeStart+'~15:10','해방촌 카페와 소품 구경','해방공원 루프탑 카페(신흥로 95-7), 해방촌 빈가게(소월로20길 27, 동네 작가 수제 물품도 있어요), 빌라커피바(신흥로 101-9 2층, 영업 확인 필요) 중에서 골라요.');
  push('15:10~15:50','서울역 쪽으로 이동',walk==='high'?'후암동을 거쳐 걸어요. 약 30분이에요.':'택시로 이동해요. 약 10분이에요.');
  push('16:00~20:00','뒹굴뒹굴 집냥이','서울역 근처에요.',true);

  if(night==='seoulro'){
    push('20:10~21:00','서울로7017 야간 산책','수국전망대에서 서울역 야경을 보고, 만리동광장 방면 서쪽 구간에서 미디어아트를 봐요. 11월 밤은 쌀쌀하니 30~40분 정도로 짧게 걸으세요.');
  }else if(night==='namsan'){
    push('20:10~21:40','남산 야경','4호선으로 서울역에서 명동역까지 가서 케이블카를 타요. 운행은 23시까지예요. 정상은 더 추우니 방한 준비를 하세요.');
  }else if(night==='wine'){
    push('20:10~22:00','해방촌 와인 2차: 서울앤쏘울','택시로 약 10분이에요. 24시까지 영업하고 예약을 권장해요. 막차 시간을 확인하세요.');
  }else{
    push('20:00','귀가','서울역에서 바로 귀가해요.');
  }
  return {title:fmtDate()+' 코스',items:it,warns:warns};
}
function fmtDate(){
  const p=DATE.split('-').map(Number);
  return p[1]+'월 '+p[2]+'일 '+'일월화수목금토'[new Date(DATE+'T00:00:00').getDay()]+'요일';
}

function textOf(r){return r.title+'\n\n'+r.items.map(i=>i.t+'  '+i.title+(i.d?' - '+i.d:'')).join('\n')}
function copy(r,btn){
  const t=textOf(r);
  const ok=()=>{btn.textContent='복사했어요';setTimeout(()=>btn.textContent='텍스트로 복사',2000)};
  const fb=()=>{
    const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    let good=false;try{good=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(good)ok();else btn.textContent='복사하지 못했어요';
  };
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}

function renderResult(stage,r){
  const h=el('h2','rtitle','코스가 나왔어요');h.tabIndex=-1;stage.appendChild(h);
  r.warns.forEach(w=>stage.appendChild(el('div','warn',w)));
  const card=el('div','card'),ul=el('ul','tl');
  r.items.forEach(i=>{
    const li=el('li',i.fixed?'fixed':'');
    li.appendChild(el('div','t',i.t));
    const b=el('div','b');b.appendChild(el('strong','',i.title));
    if(i.d)b.appendChild(el('span','',i.d));
    li.appendChild(b);ul.appendChild(li);
  });
  card.appendChild(ul);stage.appendChild(card);
  const row=el('div','row');
  const c=el('button','btn main','텍스트로 복사');c.type='button';c.onclick=()=>copy(r,c);
  const a=el('button','btn','처음부터 다시');a.type='button';
  a.onclick=()=>{A={};idx=0;done=false;show()};
  row.appendChild(c);row.appendChild(a);stage.appendChild(row);
  window.scrollTo({top:0});
  h.focus({preventScroll:true});
}

/* ---------- 서울 야경 배경 ---------- */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawSky(){
  const sky=$('#sky'),r=rng(7);
  for(let i=0;i<70;i++){
    const s=el('i','star');s.style.left=(r()*100)+'%';s.style.top=(r()*55)+'%';
    s.style.animationDelay=(r()*4)+'s';s.style.opacity=.3+r()*.6;
    if(r()>.8){s.style.width=s.style.height='3px'}
    sky.appendChild(s);
  }
  const W=1200,H=300,ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.id='city';svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('preserveAspectRatio','xMidYMax slice');
  let g='';
  // 남산과 N서울타워
  g+='<path d="M-40 300 C 40 190, 150 150, 250 175 C 330 195, 380 260, 430 300 Z" fill="#0d1538"/>';
  g+='<rect x="168" y="62" width="3" height="100" fill="#1b2556"/>';
  g+='<ellipse cx="169.5" cy="112" rx="10" ry="4.5" fill="#1b2556"/>';
  g+='<rect x="166" y="104" width="7" height="14" rx="2" fill="#1b2556"/>';
  g+='<circle cx="169.5" cy="62" r="2.5" fill="#ff9aa8"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>';
  g+='<circle cx="169.5" cy="112" r="2" fill="#ffd98a"/>';
  // 뒤쪽/앞쪽 건물
  const layer=(y0,minH,maxH,fill,lit,seed)=>{
    const q=rng(seed);let x=430,out='';
    while(x<W+40){
      const w=26+q()*46,h=minH+q()*(maxH-minH),y=y0-h;
      out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(h+2).toFixed(1)+'" fill="'+fill+'"/>';
      for(let wy=y+8;wy<y0-6;wy+=9){
        for(let wx=x+5;wx<x+w-6;wx+=8){
          if(q()<lit)out+='<rect x="'+wx.toFixed(1)+'" y="'+wy.toFixed(1)+'" width="3" height="4" fill="#ffd98a" opacity="'+(.35+q()*.55).toFixed(2)+'"/>';
        }
      }
      x+=w+3+q()*8;
    }
    return out;
  };
  g+=layer(H,50,150,'#101a44',.10,21);
  g+=layer(H,25,95,'#0a1233',.16,33);
  // 한강 느낌의 낮은 안개
  g+='<rect x="0" y="262" width="'+W+'" height="40" fill="url(#mist)"/>';
  svg.innerHTML='<defs><linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb07a" stop-opacity="0"/><stop offset="1" stop-color="#ffb07a" stop-opacity=".16"/></linearGradient></defs>'+g;
  sky.appendChild(svg);
}

$('#dateLabel').textContent=DATE.slice(0,4)+'년 '+fmtDate();
drawSky();
show();
setTimeout(()=>{document.body.classList.remove('intro');$('#intro').remove()},3400);
</script>
</body>
